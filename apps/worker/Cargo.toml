[package]
name = "winbridge-worker"
default-run = "winbridge-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Isolated native Main validation only; never used by installation/build scripts.
update-validation = ["winbridge-update/update-validation"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
winbridge-runner.workspace = true
winbridge-workspace-sync.workspace = true
winbridge-log-reader.workspace = true
winbridge-core.workspace = true
winbridge-protocol = { workspace = true, features = ["jsonschema"] }
winbridge-platform.workspace = true
winbridge-transport.workspace = true
winbridge-update = { path = "../update" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { version = "0.40", features = ["backup"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

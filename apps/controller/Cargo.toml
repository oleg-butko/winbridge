[package]
name = "winbridge-controller"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
winbridge-workspace-sync.workspace = true
winbridge-core.workspace = true
winbridge-protocol = { workspace = true, features = ["jsonschema"] }
winbridge-transport.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
schemars = "0.8.22"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
winbridge-worker = { path = "../worker" }

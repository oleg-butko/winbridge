[workspace]
members = ["crates/protocol", "crates/core", "apps/controller", "apps/worker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winbridge-protocol = { path = "crates/protocol" }
winbridge-core = { path = "crates/core" }

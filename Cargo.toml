[workspace]
members = ["crates/protocol", "crates/core", "crates/platform", "crates/transport", "apps/controller", "apps/worker", "apps/update", "modules/workspace-sync", "modules/log-reader", "modules/runner"]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winbridge-protocol = { path = "crates/protocol" }
winbridge-core = { path = "crates/core" }
winbridge-platform = { path = "crates/platform" }
winbridge-transport = { path = "crates/transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

winbridge-workspace-sync = { path = "modules/workspace-sync" }
winbridge-log-reader = { path = "modules/log-reader" }
winbridge-runner = { path = "modules/runner" }

# Update/source verification hashes complete binaries and manifests even in local
# development. Keep the standard SHA-256 implementation fast in dev/test builds.
[profile.dev.package.sha2]
opt-level = 2

[profile.test.package.sha2]
opt-level = 2

# Artifact pins search arbitrary binary bytes for a capability marker before
# querying an executable. Keep that exact search fast in local dev/test builds.
[profile.dev.package.memchr]
opt-level = 2

[profile.test.package.memchr]
opt-level = 2

# Local dev/test profile v2, validated by paired Windows pilots.
# Keep updater unoptimized: v2 retains the measured suite gain at this setting.
# Explicit safety/debug flags match the pilot, including host serde_json builds.
[profile.dev.package.winbridge-update]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.test.package.winbridge-update]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.dev.package.winbridge-core]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.test.package.winbridge-core]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.dev.package.winbridge-protocol]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.test.package.winbridge-protocol]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.dev.package.serde_json]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false

[profile.test.package.serde_json]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = false
